name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System Python with Tcl/Tk (so the frozen app has a window)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv python3-tk
          python3 -c "import tkinter; print('tk', tkinter.TkVersion)"
      - run: python3 -m venv .venv && .venv/bin/pip install --upgrade pip pyinstaller
      - run: .venv/bin/python -m PyInstaller pack/relay65.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-65-linux
          path: dist/Relay-65

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m PyInstaller pack/relay65.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-65-windows
          path: dist/Relay-65.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Name downloads for the tag
        run: |
          mkdir -p out
          cp Relay-65-linux/Relay-65 "out/Relay-65-linux"
          cp Relay-65-windows/Relay-65.exe "out/Relay-65-windows.exe"
          chmod +x out/Relay-65-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Relay-65-linux
            out/Relay-65-windows.exe
